name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CMAKE_BUILD_PARALLEL_LEVEL: 2
  CTEST_PARALLEL_LEVEL: 2

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install clang-format
        run: sudo apt-get update && sudo apt-get install -y clang-format
      - name: Check formatting
        run: |
          find src apps tests \( -name '*.cpp' -o -name '*.hpp' \) -print0 \
            | xargs -0 clang-format --dry-run --Werror

  build-test:
    name: build-test (${{ matrix.os }}, ${{ matrix.preset }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, preset: default }
          - { os: ubuntu-24.04, preset: release }
          - { os: macos-14, preset: default }
    env:
      CC: clang
      CXX: clang++
    steps:
      - uses: actions/checkout@v4
      - name: Install SDL3 build prerequisites (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libx11-dev libxext-dev libxcursor-dev \
            libxi-dev libxrandr-dev libxkbcommon-dev libgl1-mesa-dev
      - name: Install Ninja (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja
      - name: Configure
        run: cmake --preset ${{ matrix.preset }}
      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}
      - name: Test
        run: ctest --preset ${{ matrix.preset }}
      - name: Planning benchmark (informational; also cross-checks A* against BFS)
        if: matrix.preset == 'release'
        run: build/release/bench/warehousesim_planning_bench --max-size 256
      - name: Fleet benchmark (simulated figures; fails on a collision or an unaccounted task)
        if: matrix.preset == 'release'
        run: build/release/bench/warehousesim_fleet_bench
      - name: Record and replay every predefined layout (the replay must match, byte for byte)
        run: |
          for layout in demo compact fulfilment; do
            build/${{ matrix.preset }}/apps/warehousesim_cli --layout $layout --ticks 300 --seed 2 \
              --record build/ci-$layout.rec.json > build/ci-$layout.run.json
            build/${{ matrix.preset }}/apps/warehousesim_cli --replay build/ci-$layout.rec.json \
              > build/ci-$layout.replay.json
            cmp build/ci-$layout.run.json build/ci-$layout.replay.json
          done
      - name: Metrics dashboard text and CSV export (headless)
        run: |
          build/${{ matrix.preset }}/apps/warehousesim_cli --layout compact --ticks 300 --seed 1 \
            --metrics --metrics-csv build/ci-metrics > /dev/null 2> build/ci-metrics.txt
          grep -q 'Simulated results. Not a claim about real robots.' build/ci-metrics.txt
          test -s build/ci-metrics.runs.csv
      - name: Headless CLI smoke run (every predefined layout)
        run: |
          for layout in demo compact fulfilment; do
            build/${{ matrix.preset }}/apps/warehousesim_cli --layout $layout --ticks 100 --seed 1 > /dev/null
          done
      - name: GUI smoke run (SDL dummy video driver)
        env:
          SDL_VIDEODRIVER: dummy
        run: build/${{ matrix.preset }}/apps/warehousesim_gui --frames 30
      - name: Map editor smoke run (SDL dummy video driver; nothing is saved)
        env:
          SDL_VIDEODRIVER: dummy
        run: |
          build/${{ matrix.preset }}/apps/warehousesim_editor --file "$RUNNER_TEMP/smoke-map.json" \
            --layout compact --frames 30

  sanitizers:
    name: sanitizers (${{ matrix.preset }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        preset: [asan, tsan]
    env:
      CC: clang
      CXX: clang++
    steps:
      - uses: actions/checkout@v4
      - name: Install Ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build
      - name: Configure
        run: cmake --preset ${{ matrix.preset }}
      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}
      - name: Test
        run: ctest --preset ${{ matrix.preset }}

  clang-tidy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build clang clang-tidy
      - name: Configure
        env:
          CC: clang
          CXX: clang++
        run: cmake --preset tidy
      - name: Build with clang-tidy
        run: cmake --build --preset tidy
