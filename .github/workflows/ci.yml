name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CMAKE_BUILD_PARALLEL_LEVEL: 2
  CTEST_PARALLEL_LEVEL: 2

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install clang-format
        run: sudo apt-get update && sudo apt-get install -y clang-format
      - name: Check formatting
        run: |
          find src apps tests \( -name '*.cpp' -o -name '*.hpp' \) -print0 \
            | xargs -0 clang-format --dry-run --Werror

  build-test:
    name: build-test (${{ matrix.os }}, ${{ matrix.preset }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, preset: default }
          - { os: ubuntu-24.04, preset: release }
          - { os: macos-14, preset: default }
    env:
      CC: clang
      CXX: clang++
    steps:
      - uses: actions/checkout@v4
      - name: Install SDL3 build prerequisites (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libx11-dev libxext-dev libxcursor-dev \
            libxi-dev libxrandr-dev libxkbcommon-dev libgl1-mesa-dev
      - name: Install Ninja (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja
      - name: Configure
        run: cmake --preset ${{ matrix.preset }}
      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}
      - name: Test
        run: ctest --preset ${{ matrix.preset }}
      - name: Planning benchmark (informational; also cross-checks A* against BFS)
        if: matrix.preset == 'release'
        run: build/release/bench/warehousesim_planning_bench --max-size 256
      - name: Headless CLI smoke run (every predefined layout)
        run: |
          for layout in demo compact fulfilment; do
            build/${{ matrix.preset }}/apps/warehousesim_cli --layout $layout --ticks 100 --seed 1 > /dev/null
          done
      - name: GUI smoke run (SDL dummy video driver)
        env:
          SDL_VIDEODRIVER: dummy
        run: build/${{ matrix.preset }}/apps/warehousesim_gui --frames 30

  sanitizers:
    name: sanitizers (${{ matrix.preset }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        preset: [asan, tsan]
    env:
      CC: clang
      CXX: clang++
    steps:
      - uses: actions/checkout@v4
      - name: Install Ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build
      - name: Configure
        run: cmake --preset ${{ matrix.preset }}
      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}
      - name: Test
        run: ctest --preset ${{ matrix.preset }}

  clang-tidy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build clang clang-tidy
      - name: Configure
        env:
          CC: clang
          CXX: clang++
        run: cmake --preset tidy
      - name: Build with clang-tidy
        run: cmake --build --preset tidy
